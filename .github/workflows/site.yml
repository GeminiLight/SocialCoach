# Builds site/ and publishes it to GitHub Pages.
#
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# No gh-pages branch is involved; the source stays on main next to the code.
# On a custom domain, configure-pages reports base_url. Normalize its scheme to
# HTTPS: Pages can report http even when the public site is served over HTTPS.

name: site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "app/src/app/globals.css"
      - "app/src/data/corpus/**"
      - "app/src/data/taxonomy.ts"
      - "docs/social-coach-paper.pdf"
      - ".github/workflows/site.yml"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "site/**"
      - "app/src/app/globals.css"
      - "app/src/data/corpus/**"
      - "app/src/data/taxonomy.ts"
      - "docs/social-coach-paper.pdf"
      - ".github/workflows/site.yml"

permissions:
  contents: read

concurrency:
  # PR validation must not cancel an in-progress Pages publication.
  group: ${{ github.event_name == 'pull_request' && format('site-{0}', github.ref) || 'pages' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # A PR only validates the site. A push or manual run also checks whether
      # Pages is configured; forks without Pages still build and verify below.
      - id: check
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is not enabled. The site will be validated without publishing. To publish, select Settings → Pages → Source: GitHub Actions, then re-run this workflow."
          fi
      - if: steps.check.outputs.enabled == 'true'
        id: pages
        uses: actions/configure-pages@v5
      - name: Build and verify site
        run: |
          site_base="${PAGES_BASE_URL:-$(node --input-type=module -e 'import { site } from "./site/content.mjs"; process.stdout.write(site.defaultUrl)')}"
          export SITE_URL="https://${site_base#*://}"
          node site/build.mjs
          python3 site/verify-seo.py
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
      - if: steps.check.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    if: needs.build.outputs.enabled == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
